<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8BE6A">
<title>Wichita Mini Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/golf/golf.css">
</head>
<body>
<script src="/golf/engine.js"></script>
<script>
// Hole 6: Old Town. A brick street crosses the middle (bumpy, and a trolley runs along it), with
// sidewalks, street lamps and warehouses.
const STREET = [30, 300, 330, 404];
const TROLLEY = { y: 352, half: 44, r: 17, speed: 70, span: 700 };
const trolleyX = (t) => ((t * TROLLEY.speed) % TROLLEY.span) - 170;
const LAMPS = [[66, 284], [294, 284], [66, 420], [294, 420]];
const BENCHES = [[96, 206, 146, 206], [214, 486, 264, 486]];
GolfHole({
  no: 6, name: 'Old Town', par: 3,
  tip: 'Time it between trolleys. The bricks get bumpy.',
  fact: 'Old Town is Wichita’s old warehouse district. Its brick streets and brick warehouses are now home to restaurants, shops and apartments.',
  maps: 'Old Town Wichita KS',
  tee: { x: 90, y: 584 },
  cup: { x: 262, y: 150, r: 10.5 },
  bounds: [[52, 76], [308, 76], [330, 98], [330, 598], [308, 620], [52, 620], [30, 598], [30, 98]],
  turf: '#D8D2C6', stripes: false,
  rail: { side: '#5B3A2E', top: '#7A4E3C', light: '#A8735C', cap: '#2B2B2B' },
  circles: [...LAMPS.map(([x, y]) => ({ x, y, r: 5, e: 0.7 })), { x: 180, y: 150, r: 12, e: 0.6 }, { x: 300, y: 530, r: 12, e: 0.6 }],
  capsules: BENCHES.map(([ax, ay, bx, by]) => ({ ax, ay, bx, by, r: 5, e: 0.6 })),
  zones: [{ rect: STREET, friction: 1.15, jitter: 1.6 }],
  movers: [{
    at: (t) => ({ kind: 'capsule', ax: trolleyX(t) - TROLLEY.half, ay: TROLLEY.y, bx: trolleyX(t) + TROLLEY.half, by: TROLLEY.y, r: TROLLEY.r, vx: TROLLEY.speed }),
    e: 0.5, sound: 'bell', toast: '🚋 Ding ding!', nudge: '🚋 The trolley bumped your ball',
  }],
  paintOutside(c) {
    c.fillStyle = '#9C4A36'; c.fillRect(0, STREET[1], 360, STREET[3] - STREET[1]);
  },
  paintTurf(c, a) {
    c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 0.8;
    for (let y = 0; y < 640; y += 18) { c.beginPath(); c.moveTo(0, y); c.lineTo(360, y); c.stroke(); }
    for (let x = 0; x < 360; x += 18) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 640); c.stroke(); }
    // The brick street.
    const [x0, y0, x1, y1] = STREET;
    c.fillStyle = '#A9533D'; c.fillRect(x0, y0, x1 - x0, y1 - y0);
    for (let y = y0, row = 0; y < y1; y += 6, row++) {
      for (let x = x0 - (row % 2 ? 6 : 0); x < x1; x += 12) {
        c.fillStyle = ['#B65E45', '#9E4B37', '#C26A4E', '#A95540'][Math.floor(a.rnd() * 4)];
        c.fillRect(x + 0.5, y + 0.5, 11, 5);
      }
    }
    c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(x0, y0, x1 - x0, 3); c.fillRect(x0, y1 - 3, x1 - x0, 3);
    // Trolley rails.
    for (const ry of [TROLLEY.y - 12, TROLLEY.y + 12]) {
      c.fillStyle = '#6E6E6E'; c.fillRect(x0, ry - 1.5, x1 - x0, 3);
      c.fillStyle = '#C9C9C9'; c.fillRect(x0, ry - 1.5, x1 - x0, 1);
    }
  },
  paintGround(c, a) {
    c.fillStyle = a.SHADOW;
    for (const [x, y] of LAMPS) { c.beginPath(); c.ellipse(x + 8, y + 4, 10, 3, 0.3, 0, Math.PI * 2); c.fill(); }
    for (const [x, y] of [[180, 150], [300, 530]]) { c.beginPath(); c.arc(x + 5, y + 6, 14, 0, Math.PI * 2); c.fill(); }
  },
  paintScenery(c, a) {
    const base = a.G(70);
    const blds = [[2, 112, 86, 'OLD TOWN'], [118, 236, 70, 'WAREHOUSE'], [242, 358, 92, 'LOFTS']];
    for (const [x0, x1, h, sign] of blds) {
      c.fillStyle = '#9C4A36'; c.fillRect(x0, base - h, x1 - x0, h);
      c.fillStyle = 'rgba(0,0,0,.08)';
      for (let y = base - h + 3; y < base; y += 3) c.fillRect(x0, y, x1 - x0, 0.7);
      c.fillStyle = '#E9DCC0'; c.fillRect(x0 - 2, base - h - 3, x1 - x0 + 4, 4);
      for (let y = base - h + 18; y < base - 10; y += 16) {
        for (let x = x0 + 8; x < x1 - 12; x += 16) {
          c.fillStyle = '#F7D9A0'; c.fillRect(x, y, 9, 11);
          c.fillStyle = '#E9DCC0'; c.beginPath(); c.arc(x + 4.5, y, 4.5, Math.PI, 0); c.fill();
          c.strokeStyle = 'rgba(60,30,20,.5)'; c.lineWidth = 0.6; c.strokeRect(x, y, 9, 11);
        }
      }
      c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '800 8px Poppins, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(sign, (x0 + x1) / 2, base - h + 9);
      c.strokeStyle = '#15294A'; c.lineWidth = 1; c.strokeRect(x0, base - h, x1 - x0, h);
    }
  },
  uprights(ctx, a) {
    const items = LAMPS.map(([x, y]) => ({ y, draw: () => {
      const gy = a.G(y);
      ctx.fillStyle = '#2B2B2B'; ctx.fillRect(x - 1.6, gy - 30, 3.2, 30);
      ctx.fillStyle = 'rgba(255,220,140,.35)'; ctx.beginPath(); ctx.arc(x, gy - 32, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFE9B0'; ctx.strokeStyle = '#2B2B2B'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, gy - 32, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } }));
    for (const [ax, ay, bx, by] of BENCHES) items.push({ y: ay, draw: () => a.box(ctx, ax, ay, bx, by, 5, 7, '#7A4E2E', '#5E3E22') });
    for (const [x, y] of [[180, 150], [300, 530]]) items.push({ y, draw: () => {
      a.cylinder(ctx, x, y, 12, 9, '#C9C2B4', '#A59D8E', '#7E7668', '#6B4F35');
      ctx.fillStyle = '#E94B6A';
      for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(x - 8 + i * 2.6, a.G(y) - 11 - (i % 2) * 2, 2.2, 0, Math.PI * 2); ctx.fill(); }
    } });
    items.push({ y: TROLLEY.y, draw: () => {
      const x = trolleyX(a.clock), gy = a.G(TROLLEY.y + TROLLEY.r), x0 = x - TROLLEY.half - 14, w = TROLLEY.half * 2 + 28, h = 34;
      if (x0 > 380 || x0 + w < -20) return;
      ctx.fillStyle = a.SHADOW; ctx.fillRect(x0 + 6, a.G(TROLLEY.y) - 4, w, 12);
      ctx.fillStyle = '#2F7A4F'; ctx.strokeStyle = '#15294A'; ctx.lineWidth = 1.3;
      a.roundRect(ctx, x0, gy - h, w, h, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#C8A24A'; ctx.fillRect(x0, gy - 12, w, 4);
      ctx.fillStyle = '#BFE3F5';
      for (let wx = x0 + 6; wx < x0 + w - 12; wx += 14) { ctx.fillRect(wx, gy - h + 7, 10, 11); ctx.strokeRect(wx, gy - h + 7, 10, 11); }
      ctx.fillStyle = '#7A2E2E'; a.roundRect(ctx, x0 + 4, gy - h - 5, w - 8, 6, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2B2B2B';
      for (const wx of [x0 + 16, x0 + w - 16]) { ctx.beginPath(); ctx.arc(wx, gy, 4.2, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#2B2B2B'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, gy - h - 5); ctx.lineTo(x - 16, gy - h - 22); ctx.stroke();
    } });
    return items;
  },
});
</script>
<script src="/golf/gate.js"></script>
</body>
</html>
