<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8BE6A">
<title>Wichita Mini Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/golf/golf.css">
</head>
<body>
<script src="/golf/engine.js"></script>
<script>
// Hole 7: Riverfront Stadium. Tee off from home plate; the cup is out by the left-field wall. The
// pitcher's mound rolls a ball away, the bases are bumpers, and an outfielder shuffles across.
const ARC = [];
for (let d = 242; d <= 298; d += 4) ARC.push([Math.round(180 + 320 * Math.cos((d * Math.PI) / 180)), Math.round(400 + 320 * Math.sin((d * Math.PI) / 180))]);
const HOME = { x: 180, y: 598 }, MOUND = { x: 180, y: 518, r: 24 };
const BASES = [[262, 518], [180, 438], [98, 518]];
const fielder = (t) => ({ kind: 'circle', x: 180 + 100 * Math.sin(t * 0.9), y: 250, r: 9, vx: 90 * Math.cos(t * 0.9) });
GolfHole({
  no: 7, name: 'Riverfront Stadium', par: 3,
  tip: 'Bank it off the outfield wall. The mound rolls you away.',
  fact: 'Riverfront Stadium opened in 2021 on the west bank of the Arkansas River, downtown. It’s home to the Wichita Wind Surge, a minor-league baseball team.',
  maps: 'Riverfront Stadium Wichita KS',
  tee: { x: HOME.x, y: HOME.y - 8 },
  cup: { x: 96, y: 150, r: 10.5 },
  bounds: [[180, 622], [30, 472], [30, 117], ...ARC.slice(1, -1), [330, 117], [330, 472]],
  rail: { side: '#1F5135', top: '#2E6B45', light: '#5FAE7C', cap: '#F2C14E' },
  stripes: false,
  circles: BASES.map(([x, y]) => ({ x, y, r: 6, e: 0.5 })),
  zones: [{ circle: [MOUND.x, MOUND.y, MOUND.r], push: (x, y) => { const dx = x - MOUND.x, dy = y - MOUND.y, d = Math.hypot(dx, dy) || 1; return [(dx / d) * 260, (dy / d) * 260]; } }],
  movers: [{ at: fielder, e: 0.6, sound: 'crack', toast: '⚾ Blocked by the outfielder!', nudge: '⚾ The outfielder kicked it back' }],
  paintTurf(c) {
    // Mowed checkerboard, the warning track, the infield dirt and the foul lines.
    for (let y = 0; y < 640; y += 26) for (let x = 0; x < 360; x += 26) {
      if (((x + y) / 26) % 2) { c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(x, y, 26, 26); }
    }
    c.strokeStyle = '#C79A64'; c.lineWidth = 22; c.lineJoin = 'round';
    c.beginPath(); ARC.forEach(([x, y], i) => (i ? c.lineTo(x, y + 4) : c.moveTo(x, y + 4))); c.stroke();
    c.fillStyle = '#C79A64';
    c.beginPath(); c.moveTo(HOME.x, HOME.y + 22); c.lineTo(288, 518); c.lineTo(180, 410); c.lineTo(72, 518); c.closePath(); c.fill();
    c.fillStyle = '#5DB574';
    c.beginPath(); c.moveTo(HOME.x, HOME.y - 12); c.lineTo(252, 518); c.lineTo(180, 448); c.lineTo(108, 518); c.closePath(); c.fill();
    c.fillStyle = '#C79A64'; c.beginPath(); c.arc(MOUND.x, MOUND.y, MOUND.r, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(0,0,0,.1)'; c.beginPath(); c.arc(MOUND.x, MOUND.y, MOUND.r * 0.55, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#FFFFFF'; c.fillRect(MOUND.x - 6, MOUND.y - 1.5, 12, 3);
    c.strokeStyle = '#FFFFFF'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(HOME.x, HOME.y); c.lineTo(30, 448); c.moveTo(HOME.x, HOME.y); c.lineTo(330, 448); c.stroke();
    c.fillStyle = '#FFFFFF';
    c.beginPath(); c.moveTo(HOME.x - 6, HOME.y - 6); c.lineTo(HOME.x + 6, HOME.y - 6); c.lineTo(HOME.x + 6, HOME.y); c.lineTo(HOME.x, HOME.y + 5); c.lineTo(HOME.x - 6, HOME.y); c.closePath(); c.fill();
  },
  paintScenery(c, a) {
    // The stands behind the outfield wall, light towers and a scoreboard.
    const base = a.G(112);
    for (let i = 0; i < 5; i++) {
      c.fillStyle = i % 2 ? '#2F5EA8' : '#3A6DBA'; c.fillRect(0, base - 18 - i * 9, 360, 9);
      c.fillStyle = 'rgba(255,255,255,.5)';
      for (let x = (i * 7) % 11; x < 360; x += 11) c.fillRect(x, base - 15 - i * 9, 3, 3);
    }
    c.fillStyle = '#15294A'; c.fillRect(126, base - 92, 108, 44);
    c.strokeStyle = '#F2C14E'; c.lineWidth = 2; c.strokeRect(126, base - 92, 108, 44);
    c.fillStyle = '#F2C14E'; c.font = '800 11px Poppins, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('WICHITA', 180, base - 80);
    c.fillStyle = '#FFFFFF'; c.font = '700 8px Poppins, sans-serif'; c.fillText('HOLE 7 · PAR 3', 180, base - 62);
    c.fillStyle = '#6B737B'; c.fillRect(178, base - 48, 4, 30);
    for (const lx of [24, 336]) {
      c.fillStyle = '#6B737B'; c.fillRect(lx - 2, base - 110, 4, 92);
      c.fillStyle = '#F7F1D9'; c.fillRect(lx - 12, base - 122, 24, 14);
      c.strokeStyle = '#15294A'; c.lineWidth = 1; c.strokeRect(lx - 12, base - 122, 24, 14);
    }
  },
  uprights(ctx, a) {
    const items = BASES.map(([x, y]) => ({ y, draw: () => {
      const gy = a.G(y);
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#15294A'; ctx.lineWidth = 1;
      ctx.fillRect(x - 6, gy - 5, 12, 5); ctx.strokeRect(x - 6, gy - 5, 12, 5);
      ctx.fillStyle = '#F4F4F4'; ctx.fillRect(x - 6, gy - 5 - 9.6, 12, 9.6); ctx.strokeRect(x - 6, gy - 5 - 9.6, 12, 9.6);
    } }));
    items.push({ y: 250, draw: () => {
      const f = fielder(a.clock), gy = a.G(f.y);
      ctx.fillStyle = a.SHADOW; ctx.beginPath(); ctx.ellipse(f.x + 4, gy + 1, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#15294A'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      const st = Math.sin(a.clock * 9) * 3;
      ctx.beginPath(); ctx.moveTo(f.x - 2, gy - 12); ctx.lineTo(f.x - 3 + st, gy); ctx.moveTo(f.x + 2, gy - 12); ctx.lineTo(f.x + 3 - st, gy); ctx.stroke();
      ctx.fillStyle = '#F4F4F4'; ctx.strokeStyle = '#15294A'; ctx.lineWidth = 1.1;
      a.roundRect(ctx, f.x - 6, gy - 26, 12, 15, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#DC5B5F'; ctx.fillRect(f.x - 6, gy - 20, 12, 2.4);
      ctx.fillStyle = '#E8B48A'; ctx.beginPath(); ctx.arc(f.x, gy - 30, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#15294A'; ctx.beginPath(); ctx.arc(f.x, gy - 32, 4.6, Math.PI, 0); ctx.fill(); ctx.fillRect(f.x, gy - 33, 7, 2);
      ctx.fillStyle = '#8A5A34'; ctx.beginPath(); ctx.arc(f.x + 8, gy - 18, 3.5, 0, Math.PI * 2); ctx.fill();
    } });
    return items;
  },
});
</script>
</body>
</html>
