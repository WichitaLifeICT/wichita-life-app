name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .

  database:
    name: Database (migration + security tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations, seed and run tests
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stubs.sql
          # pg_net and pg_cron aren't in plain Postgres; the stubs file stands in for them.
          for f in supabase/migrations/*.sql; do
            sed -E '/create extension if not exists (pg_net|pg_cron);/d' "$f" | psql -v ON_ERROR_STOP=1
          done
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/10_rls_test.sql

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
