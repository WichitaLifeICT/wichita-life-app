# Builds the iPhone/Android app on Expo's servers (EAS Build). Run it from the
# Actions tab: "App build" -> "Run workflow". Needs the EXPO_TOKEN repository secret.
name: App build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = test build to install directly; production = for the app stores"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    name: Start EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret: Settings > Secrets and variables > Actions > New repository secret (token from expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # --no-wait: the build keeps running on Expo's servers; follow it on expo.dev.
      - run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
